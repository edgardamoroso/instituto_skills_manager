<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Definir senha | Instituto Skills Manager</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="set-password">
    <header class="site-header">
      <nav class="container nav">
        <a class="brand" href="index.html"><img src="assets/logo.svg" alt="Instituto Skills Manager" /></a>
        <div class="nav-links">
          <a href="index.html" class="nav-link">Início</a>
        </div>
      </nav>
    </header>
    <main class="container page-shell">
      <section class="auth-shell">
        <h1>Definir sua senha</h1>
        <p class="course-description">Você foi cadastrado como autor. Escolha uma senha para acessar seus cursos.</p>
        <form id="set-password-form" class="panel enrollment-form">
          <label for="sp-password">Nova senha</label>
          <input id="sp-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
          <label for="sp-confirm">Confirme a senha</label>
          <input id="sp-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required />
          <button class="btn btn-primary btn-full" type="submit">Salvar senha e entrar</button>
          <p id="set-password-feedback" class="form-feedback" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <footer class="footer"><div class="container footer-content"><p>© 2026 Instituto Skills Manager. Todos os direitos reservados.</p></div></footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
