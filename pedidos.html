<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos de eBook | Instituto Skills Manager</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="orders">
    <header class="site-header">
      <nav class="container nav">
        <a class="brand" href="index.html"><img src="assets/logo.svg" alt="Instituto Skills Manager" /></a>
        <div class="nav-links">
          <a href="admin.html" class="nav-link">Cursos</a>
          <a href="autores.html" class="nav-link">Autores</a>
          <a href="admin-ebooks.html" class="nav-link">eBooks</a>
          <a href="pedidos.html" class="nav-link active">Pedidos</a>
          <a href="alunos.html" class="nav-link">Alunos</a>
          <a href="matriculas.html" class="nav-link">Matrículas</a>
        </div>
      </nav>
    </header>
    <main class="container page-shell">
      <section class="course-heading">
        <p class="eyebrow">Área administrativa</p>
        <h1>Pedidos de eBook</h1>
        <p class="course-description">
          Gere o link de pagamento no painel do Asaas, registre aqui e, após a confirmação,
          marque como pago para liberar o download.
        </p>
      </section>
      <section class="panel">
        <div class="panel-header">
          <label for="order-filter">Filtrar por status</label>
          <select id="order-filter">
            <option value="">Todos</option>
            <option value="aguardando_link">Aguardando link</option>
            <option value="aguardando_pagamento">Aguardando pagamento</option>
            <option value="pago">Pago</option>
            <option value="entregue">Entregue</option>
            <option value="cancelado">Cancelado</option>
          </select>
        </div>
        <p id="order-feedback" class="form-feedback" role="status" aria-live="polite"></p>
        <div id="order-list" class="admin-list"></div>
      </section>
    </main>
    <footer class="footer"><div class="container footer-content"><p>© 2026 Instituto Skills Manager. Todos os direitos reservados.</p></div></footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
