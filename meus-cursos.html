<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus cursos | Instituto Skills Manager</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="assets/vendor/quill/quill.snow.css" />
  </head>
  <body data-page="my-courses">
    <header class="site-header">
      <nav class="container nav">
        <a class="brand" href="index.html"><img src="assets/logo.svg" alt="Instituto Skills Manager" /></a>
        <div class="nav-links">
          <a href="index.html" class="nav-link">Início</a>
        </div>
      </nav>
    </header>

    <main class="container page-shell">
      <section class="course-heading">
        <p class="eyebrow">Área do autor</p>
        <h1>Meus cursos</h1>
        <p class="course-description">Crie e edite os cursos que você assina. As matrículas e pagamentos ficam com a administração.</p>
      </section>

      <section class="section-stack admin-layout">
        <form id="course-form" class="panel">
          <h3 id="form-title">Adicionar curso</h3>
          <input type="hidden" id="course-id" />

          <label for="title">Nome do curso</label>
          <input id="title" name="title" type="text" required />

          <label for="type">Tipo</label>
          <select id="type" name="type" required>
            <option value="gravado">Assíncrono</option>
            <option value="online">Síncrono</option>
          </select>

          <label for="description-editor">Descrição</label>
          <div class="rich-editor"><div id="description-editor"></div></div>

          <label for="duration">Duração</label>
          <input id="duration" name="duration" type="text" required />

          <label for="price">Preço</label>
          <input id="price" name="price" type="text" required />

          <button type="submit" class="btn btn-primary btn-full">Salvar curso</button>
          <button type="button" id="cancel-edit" class="btn btn-secondary btn-full">Cancelar</button>
        </form>

        <div class="panel">
          <div class="panel-header">
            <h3>Meus cursos</h3>
            <span id="course-count" class="badge"></span>
          </div>
          <div id="admin-course-list" class="admin-list"></div>
        </div>
      </section>
    </main>

    <footer class="footer"><div class="container footer-content"><p>© 2026 Instituto Skills Manager. Todos os direitos reservados. · <a href="privacidade.html">Política de Privacidade</a></p></div></footer>
    <script src="assets/vendor/quill/quill.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
