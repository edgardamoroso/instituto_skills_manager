<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha conta | Instituto Skills Manager</title>
    <link rel="stylesheet" href="assets/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="account">
    <header class="site-header">
      <nav class="container nav">
        <a class="brand" href="index.html"><img src="assets/logo.svg" alt="Instituto Skills Manager" /></a>
        <div class="nav-links">
          <a href="index.html" class="nav-link">Início</a>
        </div>
      </nav>
    </header>
    <main class="container page-shell">
      <section class="auth-shell">
        <h1>Minha conta</h1>
        <p id="account-identity" class="course-description"></p>

        <form id="password-form" class="panel enrollment-form">
          <h2>Trocar senha</h2>
          <label for="current-password">Senha atual</label>
          <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required />
          <label for="new-password">Nova senha (mínimo 8 caracteres)</label>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" required />
          <label for="new-password-confirm">Confirme a nova senha</label>
          <input id="new-password-confirm" name="newPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required />
          <button class="btn btn-primary btn-full" type="submit">Salvar nova senha</button>
          <p id="password-feedback" class="form-feedback" role="status"></p>
        </form>

        <section id="my-ebooks" class="panel" hidden>
          <h2>Meus eBooks</h2>
          <div id="my-ebooks-list" class="admin-list"></div>
          <p id="my-ebooks-feedback" class="form-feedback" role="status" aria-live="polite"></p>
        </section>
      </section>
    </main>
    <footer class="footer"><div class="container footer-content"><p>© 2026 Instituto Skills Manager. Todos os direitos reservados.</p></div></footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
